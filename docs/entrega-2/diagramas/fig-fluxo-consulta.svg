xt><text x="656" y="343" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#5B6878" text-anchor="start">Nenhuma ação os altera: a API responde 422.</text><text x="656" y="362" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#5B6878" text-anchor="start">Um horário cancelado volta a ficar livre (RN07).</text><text x="656" y="381" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#5B6878" text-anchor="start">Transição fora deste fluxo: 422 (tabela 9.4).</text></svg>