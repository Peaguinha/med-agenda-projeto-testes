 font-size="11" font-weight="normal" fill="#5B6878" text-anchor="middle">desativada nos testes)</text><polyline points="700,310 700,395 743,395" fill="none" stroke="#9AA7B4" stroke-width="1.6" stroke-dasharray="5,4"/><polygon points="743.0,395.0 732.0,400.5 732.0,389.5" fill="#9AA7B4"/><rect x="20" y="450" width="940" height="170" rx="10" fill="#FCE5CD" stroke="#E69138" stroke-width="1.5"/><text x="36" y="474" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#7F4A00" text-anchor="start">Suíte de testes da equipe (pasta tests/ do repositório) · executada pelo GitHub Actions a cada push</text><rect x="40" y="495" width="170" height="64" rx="6" fill="#FFFFFF" stroke="#E69138" stroke-width="1.5"/><text x="125" y="520" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#7F4A00" text-anchor="middle">Jest + Supertest</text><text x="125" y="540" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#5B6878" text-anchor="middle">API, regras e permissões</text><rect x="225" y="495" width="170" height="64" rx="6" fill="#FFFFFF" stroke="#E69138" stroke-width="1.5"/><text x="310" y="520" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#7F4A00" text-anchor="middle">Cucumber.js</text><text x="310" y="540" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#5B6878" text-anchor="middle">cenários Gherkin (BDD)</text><rect x="410" y="495" width="170" height="64" rx="6" fill="#FFFFFF" stroke="#E69138" stroke-width="1.5"/><text x="495" y="520" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#7F4A00" text-anchor="middle">pdf-parse</text><text x="495" y="540" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#5B6878" text-anchor="middle">conteúdo dos PDFs</text><rect x="595" y="495" width="170" height="64" rx="6" fill="#FFFFFF" stroke="#E69138" stroke-width="1.5"/><text x="680" y="520" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#7F4A00" text-anchor="middle">Playwright + Page Objects</text><text x="680" y="540" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#5B6878" text-anchor="middle">fluxos E2E e axe</text><rect x="790" y="495" width="170" height="64" rx="6" fill="#FFFFFF" stroke="#E69138" stroke-width="1.5"/><text x="875" y="520" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#7F4A00" text-anchor="middle">k6</text><text x="875" y="540" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#5B6878" text-anchor="middle">carga (50 usuários)</text><text x="490" y="598" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#7F4A00" text-anchor="middle" font-style="italic">Relatórios (JUnit, HTML, traces, resumo do k6, resultados do axe) guardados como artefatos do pipeline</text><line x1="490" y1="448" x2="490" y2="342" stroke="#E69138" stroke-width="2.4"/><polygon points="490.0,342.0 495.5,353.0 484.5,353.0" fill="#E69138"/><text x="500" y="392" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#7F4A00" text-anchor="start">os testes chamam a interface (:8080)</text><text x="500" y="407" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#7F4A00" text-anchor="start">e a API (:3000), como um usuário real</text></svg>