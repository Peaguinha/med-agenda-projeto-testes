 x="256" y="78" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#5B6878" text-anchor="start">Docker Compose (3 contêineres) · TZ America/Sao_Paulo</text><rect x="265" y="100" width="200" height="210" rx="8" fill="#FFFFFF" stroke="#3D85C6" stroke-width="1.5"/><text x="365" y="126" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1F4D78" text-anchor="middle">web</text><text x="365" y="150" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">React 18 + Vite 5</text><text x="365" y="166" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">servido pelo Nginx</text><text x="365" y="182" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle"></text><text x="365" y="198" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">localhost:8080</text><text x="285" y="236" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#5B6878" text-anchor="start">Telas por perfil, sino</text><text x="285" y="252" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#5B6878" text-anchor="start">de notificações,</text><text x="285" y="268" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#5B6878" text-anchor="start">assistente, PDFs</text><rect x="510" y="100" width="230" height="210" rx="8" fill="#FFFFFF" stroke="#3D85C6" stroke-width="1.5"/><text x="625" y="126" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1F4D78" text-anchor="middle">api</text><text x="625" y="150" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">Node.js 20 + Express 4</text><text x="625" y="166" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">Mongoose 8 · JWT (8 h)</text><text x="625" y="182" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">PDFs com pdfkit</text><text x="625" y="198" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">localhost:3000/api</text><text x="528" y="236" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#5B6878" text-anchor="start">Regras de negócio, permissões,</text><text x="528" y="252" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#5B6878" text-anchor="start">relatórios, assistente local,</text><text x="528" y="268" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#5B6878" text-anchor="start">lembretes a cada 5 min</text><rect x="785" y="100" width="155" height="210" rx="8" fill="#FFFFFF" stroke="#3D85C6" stroke-width="1.5"/><text x="862" y="126" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1F4D78" text-anchor="middle">mongo</text><text x="862" y="150" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">MongoDB 7</text><text x="862" y="166" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">banco medagenda</text><text x="862" y="182" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle"></text><text x="862" y="198" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">localhost:27017</text><text x="800" y="236" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#5B6878" text-anchor="start">usuarios, pacientes,</text><text x=